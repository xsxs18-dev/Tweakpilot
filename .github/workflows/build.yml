name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid make xz dpkg

      - name: Checkout roothide Theos
        run: git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build packages
        run: |
          export THEOS="$HOME/theos"
          mkdir -p dist
          VERSION=$(grep '^Version:' control | cut -d' ' -f2)
          for SCHEME in roothide rootless; do
            rm -rf packages .theos
            gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=$SCHEME
            cp packages/*.deb "dist/TweakPilot_${VERSION}-build${{ github.run_number }}_${SCHEME}.deb"
          done
          ls -la dist

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^Version:' control | cut -d' ' -f2)
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" dist/*.deb \
            --title "TweakPilot $VERSION (build ${{ github.run_number }})" \
            --notes "$(git log -1 --pretty=%B)" \
            --target "${{ github.sha }}"

