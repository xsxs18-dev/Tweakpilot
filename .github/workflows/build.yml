name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid make xz dpkg

      - name: Checkout roothide Theos
        run: git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          gmake package FINALPACKAGE=1

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^Version:' control | cut -d' ' -f2)
          TAG="v${VERSION}-build${{ github.run_number }}"
          DEB=$(ls packages/*.deb | head -n1)
          cp "$DEB" "Tweakpilot_${VERSION}-build${{ github.run_number }}_roothide.deb"
          gh release create "$TAG" "Tweakpilot_${VERSION}-build${{ github.run_number }}_roothide.deb" \
            --title "Tweakpilot $VERSION (build ${{ github.run_number }})" \
            --notes "$(git log -1 --pretty=%B | grep -v '^Co-Authored-By' | grep -v '^Claude-Session')" \
            --target "${{ github.sha }}"
